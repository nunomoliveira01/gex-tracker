name: probe cboe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for u in https://cdn.cboe.com/api/global/delayed_quotes/options/SPY.json https://cdn-api.cboe.com/api/global/delayed_quotes/options/SPY.json https://cdn.cboe.com/api/global/delayed_quotes/quotes/SPY.json; do
            echo "== $u"
            curl -s -o /tmp/o -w "plain %{http_code} %{url_effective}\n" -L "$u"
            curl -s -o /tmp/o -w "ua %{http_code}\n" -L -A "$UA" "$u"
            curl -s -o /tmp/o -w "ua+ref %{http_code} %{size_download}\n" -L -A "$UA" -H "Referer: https://www.cboe.com/" -H "Origin: https://www.cboe.com" -H "Accept: application/json, text/plain, */*" -H "Accept-Language: en-US,en;q=0.9" "$u"
            head -c 300 /tmp/o; echo
            curl -sI -L -A "$UA" -H "Referer: https://www.cboe.com/" "$u" | head -20
          done
