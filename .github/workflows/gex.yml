name: Dealer gamma snapshot

# How it keeps running: every run starts the next one ~5 minutes after it began (GitHub's own
# timer is unreliable for frequent schedules). The cron below is only a backup that restarts the
# chain if it ever breaks. The script decides what to do each time:
#  - US cash market open: SPY, QQQ, SPX, retail gauge, plus ES/NQ futures
#  - only futures open (Europe/Asia hours): ES/NQ futures only
#  - everything closed: nothing (and the next check is ~1 hour later)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full snapshot even if markets are closed"
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gex
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.run.outputs.skip }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the web page files (charts, json) are kept between runs in a cache, not in the repo history
      - name: Restore last web page files
        uses: actions/cache/restore@v4
        with:
          path: docs
          key: docs-${{ github.run_id }}
          restore-keys: docs-
      - name: Keep the page template from the repo
        run: git checkout -- docs/live.html
      - name: Take snapshot
        id: run
        run: |
          python gex.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} | tee run.log
          if grep -q "nothing to do" run.log; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save history (data only)
        if: steps.run.outputs.skip != 'true'
        run: |
          git config user.name "gex-bot"
          git config user.email "gex-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Save web page files
        if: steps.run.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: docs
          key: docs-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.skip != 'true'
        with:
          path: docs
      - id: deploy
        if: steps.run.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

  # waits until ~5 minutes after this run began, then starts the next run - unless a newer run
  # (for example one started with the page's "Recalcular" button) already exists, which then carries on
  next:
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          start=$(date -d "$created" +%s)
          if [ "${{ needs.snapshot.outputs.skip }}" = "true" ]; then wait=$(( 3300 - ($(date +%s) - start) )); else wait=$(( 300 - ($(date +%s) - start) )); fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gex.yml/runs?per_page=20" \
                  --jq "[.workflow_runs[] | select(.created_at > \"$created\")] | length")
          if [ "$newer" = "0" ]; then
            gh workflow run gex.yml -R "$GITHUB_REPOSITORY" --ref main -f force=false && echo "next run started"
          else
            echo "a newer run already exists - it carries on the chain"
          fi
