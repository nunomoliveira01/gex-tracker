name: ThetaData research — run the tests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python research/backtest.py
      - run: cd research && python test4.py
      - run: cd research && python nq_test.py
      - run: cd research && if [ -f data/daily_qqq.csv ]; then python nq_native.py; fi
      - run: |
          git config user.name "gex-bot"; git config user.email "gex-bot@users.noreply.github.com"
          git add research/results*.md research/results*.json
          git diff --cached --quiet || git commit -m "research: test results"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done
